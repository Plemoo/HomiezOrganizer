name: Android production release

on:
  push:
    tags: ['v*']

defaults:
  image: sdk-57
  tools:
    node: '22.13.0'

jobs:
  quality:
    name: Lint, type-check and test
    environment: production
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npx tsc --noEmit
      - name: Test
        run: npm test -- --runInBand

  build_android:
    name: Build Android App Bundle
    needs: [quality]
    type: build
    params:
      platform: android
      profile: production

  submit_android:
    name: Upload draft to Google Play internal testing
    needs: [build_android]
    type: submit
    params:
      profile: production
      build_id: ${{ needs.build_android.outputs.build_id }}
